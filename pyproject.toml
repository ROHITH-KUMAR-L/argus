[project]
name = "argus"
version = "0.1.0"
description = "Ratcheted, subprocess-aware privilege confinement for code-executing agents (controller + evaluation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
]

[project.scripts]
argus = "controller.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a reachable Docker daemon and the built worker image",
    "rust: requires the Rust binaries built with `cargo build`",
    "llm: requires a live OpenAI-compatible endpoint configured in .env",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "evaluation/fixtures", "evaluation/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"scripts/**" = ["E501"]
"demo/**" = ["E501"]
"evaluation/**" = ["S603", "S607", "S311", "E501", "S108"]
# "/tmp" here names the worker container's tmpfs mount, not host temp files;
# the docker CLI is resolved from PATH by design.
"controller/docker_client.py" = ["S108", "S607"]
"controller/preflight.py" = ["S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["controller", "evaluation"]
exclude = ["^evaluation/(fixtures|results)/"]
